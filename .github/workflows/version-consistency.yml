name: Version consistency

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate current release version references
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check version consistency
        run: python3 src/python/check_version_consistency.py

  fidelity:
    name: Check generated property-table fidelity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install generator dependencies
        run: python -m pip install pandas==2.2.3 openpyxl==3.1.5
      - name: Check freshly generated tables and version validation
        run: python -m unittest discover -s src/python -p 'test_*.py'
