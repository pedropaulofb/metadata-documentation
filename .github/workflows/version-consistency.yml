name: Version consistency

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate current release version references
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test version consistency checker
        run: python3 -B -m unittest discover -s src/python/tests -p 'test_version_consistency.py' -v
      - name: Check version consistency
        run: python3 src/python/check_version_consistency.py
